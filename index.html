
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>canNes - Kantin UNNES</title>

    <meta name="theme-color" content="#EBD16A">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SPLASH SCREEN -->
    <section id="splash-screen">
        <img src="logo.png" alt="Logo canNes">
    </section>


    <!-- AUTHENTICATION -->
    <main class="auth-container">

        <!-- LOGO -->
        <div class="brand-logo">
            <img src="logo.png" alt="Logo canNes">
        </div>


        <!-- LOGIN PAGE -->
        <section id="login-page" class="auth-card">

            <h1>Login</h1>

            <form id="login-form">

                <div class="input-group">
                    <input
                        type="text"
                        placeholder="Username"
                        id="login-username"
                        required
                    >
                </div>

                <div class="input-group">
                    <input
                        type="password"
                        placeholder="Password"
                        id="login-password"
                        required
                    >
                </div>

                <div class="forgot-password">
                    <a href="#" id="forgot-link">Forgot Password</a>
                </div>

                <button type="submit" class="main-button">
                    Login
                </button>

            </form>


            <!-- SOCIAL LOGIN -->
            
<div class="social-login">

    <!-- FACEBOOK -->
    <button type="button" class="social-btn facebook"
        aria-label="Facebook">

        <svg viewBox="0 0 24 24">
            <path fill="white"
                d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2
                c0-.9.3-1.5 1.6-1.5h1.7V3.6
                c-.3 0-1.3-.1-2.5-.1
                -2.5 0-4.2 1.5-4.2 4.3v2.1H7.4V13
                h2.7v8z"/>
        </svg>

    </button>


    <!-- GOOGLE -->
    <button type="button" class="social-btn google"
        aria-label="Google">

        <svg viewBox="0 0 48 48">
            <path fill="#4285F4"
                d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8
                h11c-.5 2.5-2 4.6-4.2 6v5.1h6.8
                c4-3.7 6-9 6-14.8z"/>

            <path fill="#34A853"
                d="M24 44c5.5 0 10.1-1.8 13.5-4.8
                l-6.8-5.1c-1.8 1.2-4 1.9-6.7 1.9
                -5.1 0-9.4-3.4-11-8H6v5.2
                C9.4 39.7 16.2 44 24 44z"/>

            <path fill="#FBBC05"
                d="M13 28c-.5-1.3-.8-2.6-.8-4s.3-2.7.8-4
                v-5.2H6C4.7 17.4 4 20.6 4 24
                s.7 6.6 2 9.2z"/>

            <path fill="#EA4335"
                d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8
                C34.1 5.9 29.5 4 24 4
                16.2 4 9.4 8.3 6 14.8l7 5.2
                c1.6-4.6 5.9-8 11-8z"/>
        </svg>

    </button>


    <!-- APPLE -->
    <button type="button" class="social-btn apple"
        aria-label="Apple">

        <svg viewBox="0 0 24 24">
            <path fill="black"
                d="M16.7 12.8c0-2.1 1.7-3.1 1.8-3.2
                -1-1.5-2.6-1.7-3.2-1.8
                -1.4-.1-2.7.8-3.4.8
                -.7 0-1.8-.8-3-.8
                -1.6 0-3.1.9-3.9 2.4
                -1.7 2.9-.4 7.2 1.2 9.5
                .8 1.1 1.7 2.3 2.8 2.2
                1.1 0 1.5-.7 2.9-.7
                1.3 0 1.7.7 2.9.7
                1.2 0 2-1.1 2.8-2.2
                .9-1.3 1.2-2.6 1.2-2.7
                -.1 0-2.1-.8-2.1-4.2z
                M14.4 6.3c.6-.8 1-1.9.9-3
                -.9.1-2 .7-2.6 1.5
                -.6.7-1.1 1.8-1 2.8
                1 .1 2-.5 2.7-1.3z"/>
        </svg>

    </button>

</div>



            <p class="switch-text">
                Don't have account?
                <a href="#" id="go-signup">Sign Up</a>
            </p>

        </section>


        <!-- SIGN UP PAGE -->
        <section id="signup-page" class="auth-card hidden">

            <h1>Sign Up</h1>

            <a href="#" id="back-login" class="back-link">
                ← &nbsp;Back to Login
            </a>

            <form id="signup-form">

                <div class="input-group">
                    <input
                        type="text"
                        placeholder="Username"
                        id="signup-username"
                        required
                    >
                </div>

                <div class="input-group">
                    <input
                        type="email"
                        placeholder="Email"
                        id="signup-email"
                        required
                    >
                </div>

                <div class="input-group">
                    <input
                        type="password"
                        placeholder="Password"
                        id="signup-password"
                        required
                        minlength="8"
                    >
                </div>

                <div class="input-group">
                    <input
                        type="password"
                        placeholder="Confirm Password"
                        id="confirm-password"
                        required
                        minlength="8"
                    >
                </div>

                <div class="input-group">
                    <select id="signup-role" required>
                        <option value="" disabled selected>Login As</option>
                        <option value="Mahasiswa">Mahasiswa</option>
                        <option value="Penjual">Penjual</option>
                    </select>
                </div>

                <button type="submit" class="main-button signup-button">
                    Sign Up
                </button>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
